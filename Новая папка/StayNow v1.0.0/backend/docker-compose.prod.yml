services:
  staynow-db:
    image: postgres:16-alpine
    container_name: staynow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-staynow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-staynow_db}
    volumes:
      - staynow_pgdata:/var/lib/postgresql/data
    networks:
      - staynow_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-staynow_user} -d ${POSTGRES_DB:-staynow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  staynow-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: staynow-api
    restart: unless-stopped
    ports:
      # Yalnız lokal loopback-ə bind olunur, birbaşa internetə açılmır
      - "127.0.0.1:18080:8000"
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-staynow_user}:${POSTGRES_PASSWORD}@staynow-db:5432/${POSTGRES_DB:-staynow_db}
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-["*"]}
      HOST: 0.0.0.0
      PORT: 8000
      RATE_LIMIT_ENABLED: "true"
      DB_POOL_SIZE: 15
      DB_MAX_OVERFLOW: 5
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      staynow-db:
        condition: service_healthy
    networks:
      - staynow_net
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  staynow_net:
    name: staynow_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  staynow_pgdata:
    name: staynow_pgdata

