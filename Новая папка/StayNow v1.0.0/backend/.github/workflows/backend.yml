name: Backend CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Ruff Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Run Ruff Check
        run: |
          uv pip install --system ruff
          ruff check .

  test:
    name: Pytest with PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: staynow_user
          POSTGRES_PASSWORD: staynow_pass
          POSTGRES_DB: staynow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://staynow_user:staynow_pass@localhost:5432/staynow_db
      SECRET_KEY: staynow_super_secret_development_key_change_in_production_32bytes_long
      ENCRYPTION_KEY: D7z1g0T1Z1z0L4n1g9k3E4w2Q8x7V5u9Y2t1P4r6M8k=
      RATE_LIMIT_ENABLED: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run Pytest Test Suite
        run: |
          pytest -v

  docker:
    name: Docker Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t staynow-backend:latest .

